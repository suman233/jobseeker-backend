services:
  - type: web
    name: jobseeker-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URL
        sync: false
      - key: JWT_ACCESS_TOKEN_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_HOST
        sync: false
      - key: APP_NAME
        value: jobseekerBackend
      - key: API_FOLDER_NAME
        value: api
      - key: ADMIN_FOLDER_NAME
        value: admin
      - key: SHOW_NAMED_ROUTES
        value: false
